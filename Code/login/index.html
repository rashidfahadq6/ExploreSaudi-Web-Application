<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExploreSaudi | Login / Sign Up</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      font-family: 'Mulish', sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      background-color: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }

    h1 {
      margin-bottom: 1rem;
      color: #333;
    }

    p {
      margin-bottom: 2rem;
      color: #666;
    }

    /* Button styling */
    button {
      padding: 0.75rem 1.5rem;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease, transform 0.2s ease;
      margin-bottom: 1rem;
    }

    .auth-buttons button {
      background-color: #C7923E; /* Warm orange color */
      color: white;
      margin: 0.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Light shadow */
    }

    .auth-buttons button:hover {
      background-color: #d6a465; /* Lighter orange for hover effect */
      transform: translateY(-2px); /* Hover animation */
    }

    .auth-form {
      display: none;
      margin-top: 2rem;
    }

    .auth-form input {
      display: block;
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .submit-button {
      width: 100%;
      background-color: #C7923E;
      color: white;
      border-radius: 25px;
      padding: 0.75rem;
    }

    .submit-button:hover {
      background-color: #d6a465;
      transform: translateY(-2px);
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to ExploreSaudi</h1>
    <p>Discover the wonders of Saudi Arabia.</p>

    <!-- Auth buttons to toggle between login and signup forms -->
    <div class="auth-buttons">
      <button id="loginBtn">Log In</button>
      <button id="signUpBtn">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm" class="auth-form">
      <h2>Login</h2>
      <form id="login">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit" class="submit-button" id="loginSubmitBtn">Log In</button>
      </form>
    </div>

    <!-- Sign Up Form -->
    <div id="signUpForm" class="auth-form">
      <h2>Sign Up</h2>
      <form id="signUp">
        <input type="text" id="username" placeholder="Username" required>
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <button type="submit" class="submit-button">Sign Up</button>
      </form>
    </div>
  </div>

  <!-- Importing Firebase Auth JS -->
  <script type="module" src="firebaseauth.js"></script>

  <script>
    // Toggle between Login and Sign Up forms
    const loginBtn = document.getElementById('loginBtn');
    const signUpBtn = document.getElementById('signUpBtn');
    const loginForm = document.getElementById('loginForm');
    const signUpForm = document.getElementById('signUpForm');

    loginBtn.addEventListener('click', function() {
      loginForm.style.display = 'block';
      signUpForm.style.display = 'none';
    });

    signUpBtn.addEventListener('click', function() {
      signUpForm.style.display = 'block';
      loginForm.style.display = 'none';
    });
  </script>
</body>
</html>
