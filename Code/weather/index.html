<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>

  <!-- FontAwesome for icons -->
  <link href="https://pro.fontawesome.com/releases/v6.0.0-beta3/css/all.css" rel="stylesheet">

  <!-- Boxicons for icons -->
  <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Weather</h1>
      <div class="search-box">
        <input type="text" id="city_input" placeholder="Enter city name">
        <button id="searchBtn"><i class="fa fa-search"></i> Search</button>
        <button id="locationBtn"><i class="bx bx-target-lock"></i> Current Location</button>
      </div>
    </header>

    <!-- Main Weather Section -->
    <section class="weather-section">
      <!-- Current Weather -->
      <div class="current-weather">
        <h3>Now</h3>
        <div class="weather-info">
          <h1 class="temperature">--°C</h1>
          <i class="fa fa-cloud"></i>
          <div class="additional-info">
            <p class="date">--</p>
            <p class="location">--</p>
          </div>
          <p class="humidity">--%</p>
          <p class="pressure">-- hPa</p>
          <p class="wind-speed">-- m/s</p>
          <p class="visibility">-- km</p>
        </div>
      </div>

      <!-- 5 Days Forecast -->
      <div class="forecast">
        <h3>5 Days Forecast</h3>
        <div class="forecast-list">
          <!-- Forecast data will be injected here -->
        </div>
      </div>

      <!-- Today's Highlights -->
      <div class="highlights">
        <h3>Today's Highlights</h3>
        <div class="highlight-cards">
          <div class="highlight">
            <h4>Air Quality Index</h4>
            <p>CO: <span class="co">--</span></p>
            <p>PM2.5: <span class="pm25">--</span></p>
            <p>PM10: <span class="pm10">--</span></p>
            <p>NO2: <span class="no2">--</span></p>
            <p>O3: <span class="o3">--</span></p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
